<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktiv Test Platformasi</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.06);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 28px;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 15px;
        }
        #loading-status {
            text-align: center;
            font-size: 18px;
            color: #2980b9;
            padding: 50px;
            font-weight: bold;
        }
        .question-block {
            margin-bottom: 25px;
            padding: 20px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            background-color: #fff;
        }
        .question-text {
            font-size: 16px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 15px;
            line-height: 1.6;
        }
        .options-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        .option-item {
            margin-bottom: 10px;
        }
        .option-item label {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            color: #334155;
            transition: all 0.2s ease;
        }
        .option-item label:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }
        .option-item input[type="radio"] {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #3b82f6;
        }
        .option-item input[type="radio"]:disabled,
        .option-item label.disabled-label {
            cursor: not-allowed;
        }
        .option-item label.disabled-label:hover {
            background: #f8fafc;
            border-color: #e2e8f0;
        }
        .btn-container {
            text-align: center;
            margin-top: 35px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        button {
            padding: 14px 32px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn-submit { background-color: #10b981; color: white; }
        .btn-submit:hover { background-color: #059669; }
        .btn-submit:disabled { background-color: #94a3b8; cursor: not-allowed; }
        .btn-reset { background-color: #64748b; color: white; }
        .btn-reset:hover { background-color: #475569; }
        #result {
            margin-top: 30px;
            padding: 22px;
            border-radius: 8px;
            text-align: center;
            font-size: 19px;
            font-weight: bold;
            display: none;
            background-color: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }
        .correct-style {
            background-color: #d1fae5 !important;
            color: #065f46 !important;
            border-color: #34d399 !important;
            font-weight: bold;
        }
        .wrong-style {
            background-color: #fee2e2 !important;
            color: #991b1b !important;
            border-color: #f87171 !important;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📝 Onlayn Test Tizimi</h1>
    <div class="subtitle">Variantlardan birini tanlang va o'z bilimingizni sinab ko'ring</div>
    
    <div id="loading-status">Savollar va variantlar yuklanmoqda...</div>

    <div id="quiz-panel" style="display: none;">
        <div id="quiz-wrapper"></div>
        <div class="btn-container">
            <button class="btn-submit" id="btn-check" onclick="checkAnswers()">Natijani Tekshirish</button>
            <button class="btn-reset" onclick="resetQuiz()">Qayta yechish</button>
        </div>
        <div id="result"></div>
    </div>
</div>

<script>
    let questionsData = [];
    let allAnswersPool = []; // Variantlar yo'q bo'lsa, xato variant yasash uchun baza

    window.addEventListener('DOMContentLoaded', () => {
        loadTestsFromFile();
    });

    async function loadTestsFromFile() {
        try {
            const response = await fetch('testlar.txt');
            if (!response.ok) {
                throw new Error("testlar.txt fayli topilmadi. Nomi kichik harflarda yozilganiga ishonch hosil qiling.");
            }
            const textData = await response.text();
            
            parseTestData(textData);
            
            if (questionsData.length === 0) {
                document.getElementById('loading-status').innerText = "Fayl ichidan yaroqli test topilmadi.";
                return;
            }

            // Variantlari yo'q savollar uchun sun'iy variantlar qo'shish
            fillMissingOptions();

            document.getElementById('loading-status').style.display = 'none';
            document.getElementById('quiz-panel').style.display = 'block';
            
            generateQuiz();

        } catch (error) {
            console.error(error);
            document.getElementById('loading-status').innerHTML = 
                `<span style="color:#ef4444;">Yuklashda xatolik: ${error.message}<br>GitHub repository-ingizda 'testlar.txt' borligini qayta tekshiring!</span>`;
        }
    }

    function parseTestData(text) {
        // Har bir qatorni alohida tahlil qilamiz (chunki Word format har xil)
        const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        
        let currentQuestion = null;

        lines.forEach(line => {
            // Agar satrda (To'g'ri javob) bo'lsa va u alohida variant bo'lmasa (masalan: 864-savoldek yonma-yon kelgan bo'lsa)
            if ((line.includes("(To'g'ri javob)") || line.includes("(Toʻgʻri javob)")) && !line.startsWith('*') && !line.match(/^[A-Da-d][\.\)]/)) {
                
                // Savol va javob bitta qatorda kelgan holat (Masalan: "864 Chuqur tromboz: shish (To'g'ri javob)")
                let cleanLine = line.replace(/\(To'g'ri javob\)/g, "").replace(/\(Toʻgʻri javob\)/g, "").trim();
                let parts = cleanLine.split(/[:–-]/); // Ikki nuqta yoki chiziqcha bilan ajratamiz
                
                let qText = parts[0].replace(/^\d+\.\s*/, "").replace(/^Savol:\s*/i, "").trim();
                let aText = parts.slice(1).join(':').trim(); // Javob qismi
                
                if(!aText) { // Agar ikki nuqta bo'lmasa hammasini javob deb olamiz
                    aText = cleanLine;
                }

                if(qText && aText) {
                    questionsData.push({
                        question: qText,
                        correct: aText,
                        incorrect: [] // Variantlar keyin to'ldiriladi
                    });
                    allAnswersPool.push(aText);
                }
                currentQuestion = null; // Eski zanjirni uzamiz
                return;
            }

            // Agar qator yangi savol bo'lsa (Raqam bilan boshlansa yoki Savol: deb yozilgan bo'lsa)
            if (line.match(/^\d+[\.\s]/) || line.toLowerCase().startsWith('savol:')) {
                let qText = line.replace(/^\d+[\.\s]*/, "").replace(/^Savol:\s*/i, "").trim();
                
                currentQuestion = {
                    question: qText,
                    correct: "",
                    incorrect: []
                };
                questionsData.push(currentQuestion);
                return;
            }

            // Agar qator variant bo'lsa va tepada savol ochilgan bo'lsa
            if (currentQuestion) {
                let optionText = line.replace(/^[\*\-\u2022]\s*/, "").replace(/^[A-Za-Dae-z][\.\)]\s*/, "").trim();
                
                if (line.includes("(To'g'ri javob)") || line.includes("(Toʻgʻri javob)")) {
                    optionText = optionText.replace(/\(To'g'ri javob\)/g, "").replace(/\(Toʻgʻri javob\)/g, "").trim();
                    currentQuestion.correct = optionText;
                    allAnswersPool.push(optionText);
                } else {
                    currentQuestion.incorrect.push(optionText);
                }
            }
        });

        // Hech qanday strukturaga tushmagan toza massivlarni tozalash
        questionsData = questionsData.filter(q => q.question && q.correct);
    }

    // Variantlari yo'q (bitta qatorda yozilgan) savollarga tasodifiy variantlar yasash
    function fillMissingOptions() {
        questionsData.forEach(q => {
            if (q.incorrect.length === 0) {
                // Umumiy javoblar ichidan ushbu savolga mos kelmaydigan 3 ta tasodifiy javobni tanlaymiz
                let pool = allAnswersPool.filter(a => a !== q.correct);
                pool = shuffle(pool);
                q.incorrect = pool.slice(0, 3);
                
                // Agar bazada javoblar kam bo'lsa, standart variant qo'shib qo'yamiz
                while(q.incorrect.length < 3) {
                    q.incorrect.push("Noto'g'ri variant ma'lumoti");
                }
            }
        });
    }

    function shuffle(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex != 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    const quizWrapper = document.getElementById('quiz-wrapper');
    const resultDiv = document.getElementById('result');

    function generateQuiz() {
        quizWrapper.innerHTML = "";
        resultDiv.style.display = "none";
        document.getElementById('btn-check').disabled = false;

        const shuffledQuestions = shuffle([...questionsData]);

        shuffledQuestions.forEach((q, qIndex) => {
            const allOptions = shuffle([q.correct, ...q.incorrect]);

            const questionBlock = document.createElement('div');
            questionBlock.className = 'question-block';

            const qText = document.createElement('div');
            qText.className = 'question-text';
            qText.innerText = `${qIndex + 1}. ${q.question}`;
            questionBlock.appendChild(qText);

            const optionsList = document.createElement('ul');
            optionsList.className = 'options-list';

            allOptions.forEach((option, oIndex) => {
                const optionItem = document.createElement('li');
                optionItem.className = 'option-item';
                const labelId = `lbl_${qIndex}_${oIndex}`;

                optionItem.innerHTML = `
                    <label id="${labelId}">
                        <input type="radio" name="question_${qIndex}" value="${option.replace(/"/g, '&quot;')}" data-label-id="${labelId}" data-correct-val="${q.correct.replace(/"/g, '&quot;')}">
                        <span class="opt-text">${option}</span>
                    </label>
                `;
                optionsList.appendChild(optionItem);
            });

            questionBlock.appendChild(optionsList);
            quizWrapper.appendChild(questionBlock);
        });
    }

    function checkAnswers() {
        let score = 0;
        const blocksCount = quizWrapper.querySelectorAll('.question-block').length;

        const allRadios = quizWrapper.querySelectorAll('input[type="radio"]');
        allRadios.forEach(radio => radio.disabled = true);
        
        const allLabels = quizWrapper.querySelectorAll('.option-item label');
        allLabels.forEach(label => label.classList.add('disabled-label'));

        for (let i = 0; i < blocksCount; i++) {
            const inputs = document.querySelectorAll(`input[name="question_${i}"]`);
            let selectedInput = null;
            let correctInput = null;

            inputs.forEach(input => {
                if (input.checked) selectedInput = input;
                if (input.value === input.getAttribute('data-correct-val')) correctInput = input;
            });

            if (correctInput) {
                const correctLabel = document.getElementById(correctInput.getAttribute('data-label-id'));
                if (correctLabel) correctLabel.className = 'correct-style disabled-label';
            }

            if (selectedInput) {
                if (selectedInput.value !== selectedInput.getAttribute('data-correct-val')) {
                    const wrongLabel = document.getElementById(selectedInput.getAttribute('data-label-id'));
                    if (wrongLabel) wrongLabel.className = 'wrong-style disabled-label';
                } else {
                    score++;
                }
            }
        }

        resultDiv.style.display = 'block';
        resultDiv.innerHTML = `Siz jami ${blocksCount} ta savoldan <strong>${score}</strong> tasiga to'g'ri javob berdingiz! (${Math.round((score/blocksCount)*100)}%)`;
        resultDiv.scrollIntoView({ behavior: 'smooth' });
        
        document.getElementById('btn-check').disabled = true;
    }

    function resetQuiz() {
        generateQuiz();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>

</body>
</html>
