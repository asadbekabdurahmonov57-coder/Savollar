<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktiv Test Platformasi</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 20px;
            color: #1e293b;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.08);
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }
        .tab-btn {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: none;
            border: none;
            color: #64748b;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background-color: #3b82f6;
            color: white;
        }
        .panel { display: none; }
        .panel.active { display: block; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 5px; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 15px;
        }
        .info-note { font-size: 12px; color: #64748b; margin-top: 3px; }
        
        .btn {
            padding: 10px 20px; font-size: 15px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: background 0.2s;
        }
        .btn-blue { background: #3b82f6; color: white; }
        .btn-blue:hover { background: #2563eb; }
        .btn-green { background: #10b981; color: white; }
        .btn-green:hover { background: #059669; }
        .btn-red { background: #ef4444; color: white; }
        .btn-red:hover { background: #dc2626; }
        
        .question-block { margin-bottom: 25px; padding: 20px; border: 1px solid #e2e8f0; border-radius: 10px; background-color: #fff; }
        .question-text { font-size: 16px; font-weight: 600; margin-bottom: 15px; line-height: 1.6; }
        .options-list { list-style-type: none; padding: 0; margin: 0; }
        .option-item { margin-bottom: 10px; }
        .option-item label {
            display: flex; align-items: center; padding: 12px 16px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; cursor: pointer; font-size: 15px; transition: all 0.2s;
        }
        .option-item label:hover { background: #f1f5f9; }
        .option-item input[type="radio"] { margin-right: 12px; width: 18px; height: 18px; accent-color: #3b82f6; }
        
        .option-item input[type="radio"]:disabled, .option-item label.disabled-label { cursor: not-allowed; }
        .correct-style { background-color: #d1fae5 !important; color: #065f46 !important; border-color: #34d399 !important; font-weight: bold; }
        .wrong-style { background-color: #fee2e2 !important; color: #991b1b !important; border-color: #f87171 !important; font-weight: bold; }
        
        #result-box {
            margin-top: 20px; padding: 20px; border-radius: 8px; text-align: center; font-size: 18px; font-weight: bold; display: none; background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46;
        }
        .q-list-item { padding: 10px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
        #loading-status { text-align: center; font-size: 16px; color: #2563eb; padding: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('quiz-tab', this)">📝 Test Yechish</button>
        <button class="tab-btn" onclick="switchTab('admin-tab', this)">⚙️ Admin Panel (Savol Qo'shish)</button>
    </div>

    <div id="quiz-tab" class="panel active">
        <h2 style="margin-top:0;">📝 Savollarga javob bering</h2>
        <div id="loading-status">testlar.txt faylidan savollar o'qilmoqda...</div>
        <div id="quiz-wrapper"></div>
        <div style="margin-top: 20px; text-align: center; display: none;" id="quiz-controls">
            <button class="btn btn-green" id="btn-check" onclick="checkAnswers()">Natijani Tekshirish</button>
            <button class="btn btn-blue" onclick="renderQuiz()">Qayta yechish (Aralashtirish)</button>
        </div>
        <div id="result-box"></div>
    </div>

    <div id="admin-tab" class="panel">
        <h2 style="margin-top:0;">⚙️ Yangi Savol Qo'shish</h2>
        <p style="color: #64748b; font-size: 14px;">Savollarni kiriting. Har bir savol qo'shilganda sizga avtomatik ravishda <strong>testlar.txt</strong> fayli yuklab beriladi.</p>
        
        <div class="form-group">
            <label>Savol matni:</label>
            <textarea id="inp-question" rows="2" placeholder="Savolni shu yerga yozing..."></textarea>
        </div>
        <div class="form-group">
            <label style="color: #10b981;">To'g'ri javob varianti:</label>
            <input type="text" id="inp-correct" placeholder="To'g'ri javobni yozing">
            <div class="info-note">* belgilari boshida kelsa avtomatik o'chiriladi</div>
        </div>
        <div class="form-group">
            <label style="color: #ef4444;">Noto'g'ri variant 1:</label>
            <input type="text" id="inp-wrong1" placeholder="Noto'g'ri javob variantini yozing">
        </div>
        <div class="form-group">
            <label style="color: #ef4444;">Noto'g'ri variant 2:</label>
            <input type="text" id="inp-wrong2" placeholder="Noto'g'ri javob variantini yozing">
        </div>
        <div class="form-group">
            <label style="color: #ef4444;">Noto'g'ri variant 3:</label>
            <input type="text" id="inp-wrong3" placeholder="Noto'g'ri javob variantini yozing">
        </div>
        
        <button class="btn btn-blue" onclick="addQuestion()">➕ Bazaga Qo'shish va Faylni Yuklash</button>
        <button class="btn btn-red" onclick="clearAllData()" style="float: right;">🗑️ Barchasini O'chirish</button>
        
        <h3 style="margin-top: 30px; border-top: 2px dashed #cbd5e1; padding-top: 20px;">Hozirgi savollar ro'yxati (<span id="q-count">0</span> ta):</h3>
        <div id="admin-questions-list"></div>
    </div>
</div>

<script>
    let customQuestions = [];

    // Sahifa yuklanganda to'g'ridan-to'g'ri GitHub repository ichidagi 'testlar.txt' faylini o'qiymiz
    window.addEventListener('DOMContentLoaded', () => {
        loadTxtFile();
    });

    async function loadTxtFile() {
        const status = document.getElementById('loading-status');
        try {
            const response = await fetch('testlar.txt');
            if (!response.ok) {
                status.innerText = "testlar.txt fayli topilmadi yoki hali yaratilmagan. Admin paneldan savol qo'shib yuklang.";
                return;
            }
            const dataText = await response.text();
            if(dataText.trim().length > 0) {
                customQuestions = JSON.parse(dataText);
                status.style.display = 'none';
                renderQuiz();
            } else {
                status.innerText = "testlar.txt fayli bo'sh. Admin paneldan savol qo'shing.";
            }
        } catch (e) {
            status.innerText = "Faylni o'qishda xatolik yoki fayl hali yo'q.";
            console.error(e);
        }
    }

    function switchTab(tabId, btnElement) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btnElement.classList.add('active');
        if(tabId === 'admin-tab') renderAdminList();
    }

    function cleanInputText(text) {
        return text.trim().replace(/^[\*\-\u2022\.\s]+/, "").trim();
    }

    function shuffle(array) {
        let currentIndex = array.length, randomIndex;
        let newArray = [...array];
        while (currentIndex != 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [newArray[currentIndex], newArray[randomIndex]] = [newArray[randomIndex], newArray[currentIndex]];
        }
        return newArray;
    }

    // SAVOL QO'SHISH VA AVTOMATIK TXT YUKLAB BERISH
    function addQuestion() {
        let qText = document.getElementById('inp-question').value.trim();
        let correct = document.getElementById('inp-correct').value;
        let w1 = document.getElementById('inp-wrong1').value;
        let w2 = document.getElementById('inp-wrong2').value;
        let w3 = document.getElementById('inp-wrong3').value;

        if(!qText || !correct || !w1 || !w2 || !w3) {
            alert("Iltimos, barcha maydonlarni to'ldiring!");
            return;
        }

        correct = cleanInputText(correct);
        w1 = cleanInputText(w1);
        w2 = cleanInputText(w2);
        w3 = cleanInputText(w3);

        const newQuestion = {
            question: qText,
            correct: correct,
            incorrect: [w1, w2, w3]
        };

        customQuestions.push(newQuestion);
        
        // Inputlarni tozalash
        document.getElementById('inp-question').value = "";
        document.getElementById('inp-correct').value = "";
        document.getElementById('inp-wrong1').value = "";
        document.getElementById('inp-wrong2').value = "";
        document.getElementById('inp-wrong3').value = "";

        renderAdminList();
        renderQuiz();
        
        // AVTOMATIK TXT FAYL YARATIB YUKLASH TIZIMI
        downloadTxtFile();
        alert("Savol qo'shildi! '*' belgilari tozalandi va sizga yangilangan 'testlar.txt' yuklab berildi.");
    }

    function downloadTxtFile() {
        const dataStr = JSON.stringify(customQuestions, null, 4);
        const blob = new Blob([dataStr], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        
        const link = document.createElement("a");
        link.href = url;
        link.download = "testlar.txt"; // Fayl nomi avtomatik ravishda shu nomda yuklanadi
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }

    function renderAdminList() {
        const listDiv = document.getElementById('admin-questions-list');
        document.getElementById('q-count').innerText = customQuestions.length;
        listDiv.innerHTML = "";

        customQuestions.forEach((q, index) => {
            const item = document.createElement('div');
            item.className = 'q-list-item';
            item.innerHTML = `
                <div><strong>${index + 1}.</strong> ${q.question}</div>
                <button class="btn btn-red" style="padding:4px 10px; font-size:12px;" onclick="deleteQuestion(${index})">O'chirish</button>
            `;
            listDiv.appendChild(item);
        });
    }

    function deleteQuestion(index) {
        if(confirm("Ushbu savolni o'chirishni xohlaysizmi?")) {
            customQuestions.splice(index, 1);
            renderAdminList();
            renderQuiz();
            downloadTxtFile(); // O'chirilganda ham faylni qayta yangilab yuklaydi
        }
    }

    function clearAllData() {
        if(confirm("Barcha testlar o'chib ketsinmi?")) {
            customQuestions = [];
            renderAdminList();
            renderQuiz();
            downloadTxtFile();
        }
    }

    let activeQuizQuestions = [];
    function renderQuiz() {
        const wrapper = document.getElementById('quiz-wrapper');
        const resBox = document.getElementById('result-box');
        const controls = document.getElementById('quiz-controls');
        resBox.style.display = "none";
        document.getElementById('btn-check').disabled = false;

        if(customQuestions.length === 0) {
            wrapper.innerHTML = "Hozircha testlar bazasi bo'sh. Iltimos, Admin panelga o'tib savol kiriting.";
            controls.style.display = "none";
            return;
        }
        controls.style.display = "block";
        wrapper.innerHTML = "";

        activeQuizQuestions = shuffle(customQuestions);

        activeQuizQuestions.forEach((q, qIndex) => {
            const allOptions = shuffle([q.correct, ...q.incorrect]);
            
            const block = document.createElement('div');
            block.className = 'question-block';
            block.innerHTML = `<div class="question-text">${qIndex + 1}. ${q.question}</div>`;
            
            const optionsList = document.createElement('ul');
            optionsList.className = 'options-list';

            const letters = ['A', 'B', 'C', 'D'];
            allOptions.forEach((opt, oIndex) => {
                const labelId = `lbl_${qIndex}_${oIndex}`;
                const li = document.createElement('li');
                li.className = 'option-item';
                li.innerHTML = `
                    <label id="${labelId}">
                        <input type="radio" name="q_${qIndex}" value="${opt.replace(/"/g, '&quot;')}" data-label-id="${labelId}" data-correct="${q.correct.replace(/"/g, '&quot;')}">
                        <span><strong>${letters[oIndex]})</strong> ${opt}</span>
                    </label>
                `;
                optionsList.appendChild(li);
            });

            block.appendChild(optionsList);
            wrapper.appendChild(block);
        });
    }

    function checkAnswers() {
        let score = 0;
        const radios = document.querySelectorAll('#quiz-wrapper input[type="radio"]');
        radios.forEach(r => r.disabled = true);

        const allLabels = document.querySelectorAll('#quiz-wrapper .option-item label');
        allLabels.forEach(l => l.classList.add('disabled-label'));

        activeQuizQuestions.forEach((q, qIndex) => {
            const inputs = document.querySelectorAll(`input[name="q_${qIndex}"]`);
            let selected = null;
            let correctInput = null;

            inputs.forEach(input => {
                if(input.checked) selected = input;
                if(input.value === input.getAttribute('data-correct')) correctInput = input;
            });

            if(correctInput) {
                document.getElementById(correctInput.getAttribute('data-label-id')).classList.add('correct-style');
            }
            if(selected) {
                if(selected.value !== selected.getAttribute('data-correct')) {
                    document.getElementById(selected.getAttribute('data-label-id')).classList.add('wrong-style');
                } else {
                    score++;
                }
            }
        });

        const resBox = document.getElementById('result-box');
        resBox.style.display = "block";
        resBox.innerHTML = `Siz jami ${activeQuizQuestions.length} ta savoldan ${score} tasiga to'g'ri javob berdingiz. (${Math.round((score/activeQuizQuestions.length)*100)}%)`;
        resBox.scrollIntoView({ behavior: 'smooth' });
        document.getElementById('btn-check').disabled = true;
    }
</script>

</body>
</html>
