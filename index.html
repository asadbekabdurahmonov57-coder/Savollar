<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktiv Test Platformasi</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.06);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 28px;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 15px;
        }
        .question-block {
            margin-bottom: 25px;
            padding: 20px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            background-color: #fff;
        }
        .question-text {
            font-size: 16px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 15px;
            line-height: 1.6;
        }
        .options-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        .option-item {
            margin-bottom: 10px;
        }
        .option-item label {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            color: #334155;
            transition: all 0.2s ease;
        }
        .option-item label:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }
        .option-item input[type="radio"] {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #3b82f6;
        }
        .option-item input[type="radio"]:disabled,
        .option-item label.disabled-label {
            cursor: not-allowed;
        }
        .option-item label.disabled-label:hover {
            background: #f8fafc;
            border-color: #e2e8f0;
        }
        .btn-container {
            text-align: center;
            margin-top: 35px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        button {
            padding: 14px 32px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn-submit { background-color: #10b981; color: white; }
        .btn-submit:hover { background-color: #059669; }
        .btn-submit:disabled { background-color: #94a3b8; cursor: not-allowed; }
        .btn-reset { background-color: #64748b; color: white; }
        .btn-reset:hover { background-color: #475569; }
        #result {
            margin-top: 30px;
            padding: 22px;
            border-radius: 8px;
            text-align: center;
            font-size: 19px;
            font-weight: bold;
            display: none;
            background-color: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }
        .correct-style {
            background-color: #d1fae5 !important;
            color: #065f46 !important;
            border-color: #34d399 !important;
            font-weight: bold;
        }
        .wrong-style {
            background-color: #fee2e2 !important;
            color: #991b1b !important;
            border-color: #f87171 !important;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📝 Onlayn Test Tizimi</h1>
    <div class="subtitle">Variantlardan birini tanlang va o'z bilimingizni sinab ko'ring</div>
    
    <div id="quiz-panel">
        <div id="quiz-wrapper"></div>
        <div class="btn-container">
            <button class="btn-submit" id="btn-check" onclick="checkAnswers()">Natijani Tekshirish</button>
            <button class="btn-reset" onclick="resetQuiz()">Qayta yechish</button>
        </div>
        <div id="result"></div>
    </div>
</div>

<script>
    // Barcha savollar va variantlar to'g'ridan-to'g'ri kod ichiga joylashtirildi
    const questionsData = [
        {
            question: "Oshqozonning qaysi operatsiyasidan so‘ng postgastrorezektsion sindrom rivojlanishi mumkin?",
            correct: "me’da rezektsiyasi",
            incorrect: ["gastrotomiya", "perforativ yarani tikish", "hamma javoblar to‘g‘ri"]
        },
        {
            question: "Exinokokkoz etiologik faktorlarini ko‘rsating.",
            correct: "gelment",
            incorrect: ["bakteriya", "virus", "zamburug‘"]
        },
        {
            question: "Asoratlangan o‘pka exinokokkini radikal davolash usuli.",
            correct: "xirurgik",
            incorrect: ["konservativ", "ximioterapevtik", "rentgenoradiologik"]
        },
        {
            question: "Magistral o‘t yo‘llariga exinokokk kistasini yorilishiga xarakterli simptomlarni ko‘rsating.",
            correct: "teri qoplamlarini sarg‘ayishi",
            incorrect: ["qorinda o‘tkir og‘riqlar", "diareya", "qayt qilish"]
        },
        {
            question: "Exinokokkning asosiy xo‘jayinini ko‘rsating.",
            correct: "bo‘ri, chiya bo‘ri, it",
            incorrect: ["odam va uy hayvonlari", "bo‘ri, it va odam", "bo‘ri va uy hayvonlari"]
        },
        {
            question: "Chuqur tromboflebit uchun xarakterli simptom kompleksi qaysi?",
            correct: "keskin shish va og‘riq",
            incorrect: ["bosh aylanishi", "teri qizarishi", "bosh og'rig'i"]
        },
        {
            question: "Skleroterapiya muolajasi qachon qilinmaydi?",
            correct: "chuqur venalar buzilganda",
            incorrect: ["yuzaki venalar kengayganda", "homiladorlikning boshida", "limfadenitda"]
        },
        {
            question: "Varikoz kasalligining asosiy sababi nima?",
            correct: "venoz klapan yetishmovchiligi",
            incorrect: ["limfadenit", "kamqonlik", "arterial ishemiya"]
        },
        {
            question: "Trofik yara paydo bo'lishining bosh omili qaysi?",
            correct: "surunkali venoz yetishmovchilik",
            incorrect: ["jarohatlanish", "bakterial infeksiya", "vitamin etishmasligi"]
        }
    ];

    function shuffle(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex != 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    const quizWrapper = document.getElementById('quiz-wrapper');
    const resultDiv = document.getElementById('result');

    function generateQuiz() {
        quizWrapper.innerHTML = "";
        resultDiv.style.display = "none";
        document.getElementById('btn-check').disabled = false;

        // Savollarni tasodifiy aralashtirish
        const shuffledQuestions = shuffle([...questionsData]);

        shuffledQuestions.forEach((q, qIndex) => {
            // Variantlarni birlashtirib aralashtirish
            const allOptions = shuffle([q.correct, ...q.incorrect]);

            const questionBlock = document.createElement('div');
            questionBlock.className = 'question-block';

            const qText = document.createElement('div');
            qText.className = 'question-text';
            qText.innerText = `${qIndex + 1}. ${q.question}`;
            questionBlock.appendChild(qText);

            const optionsList = document.createElement('ul');
            optionsList.className = 'options-list';

            // Variant harflari: A, B, C, D
            const letters = ['A', 'B', 'C', 'D'];

            allOptions.forEach((option, oIndex) => {
                const optionItem = document.createElement('li');
                optionItem.className = 'option-item';
                const labelId = `lbl_${qIndex}_${oIndex}`;
                const currentLetter = letters[oIndex] || '-';

                optionItem.innerHTML = `
                    <label id="${labelId}">
                        <input type="radio" name="question_${qIndex}" value="${option.replace(/"/g, '&quot;')}" data-label-id="${labelId}" data-correct-val="${q.correct.replace(/"/g, '&quot;')}">
                        <span class="opt-text"><strong>${currentLetter})</strong> ${option}</span>
                    </label>
                `;
                optionsList.appendChild(optionItem);
            });

            questionBlock.appendChild(optionsList);
            quizWrapper.appendChild(questionBlock);
        });
    }

    function checkAnswers() {
        let score = 0;
        const blocksCount = quizWrapper.querySelectorAll('.question-block').length;

        // Variantlarni tanlashni butunlay qulflash
        const allRadios = quizWrapper.querySelectorAll('input[type="radio"]');
        allRadios.forEach(radio => radio.disabled = true);
        
        const allLabels = quizWrapper.querySelectorAll('.option-item label');
        allLabels.forEach(label => label.classList.add('disabled-label'));

        for (let i = 0; i < blocksCount; i++) {
            const inputs = document.querySelectorAll(`input[name="question_${i}"]`);
            let selectedInput = null;
            let correctInput = null;

            inputs.forEach(input => {
                if (input.checked) selectedInput = input;
                if (input.value === input.getAttribute('data-correct-val')) correctInput = input;
            });

            // To'g'ri javob doim yashil bo'ladi
            if (correctInput) {
                const correctLabel = document.getElementById(correctInput.getAttribute('data-label-id'));
                if (correctLabel) correctLabel.className = 'correct-style disabled-label';
            }

            // Noto'g'ri tanlangan javob qizil bo'ladi va qayta bosib bo'lmaydi
            if (selectedInput) {
                if (selectedInput.value !== selectedInput.getAttribute('data-correct-val')) {
                    const wrongLabel = document.getElementById(selectedInput.getAttribute('data-label-id'));
                    if (wrongLabel) wrongLabel.className = 'wrong-style disabled-label';
                } else {
                    score++;
                }
            }
        }

        // Natija oynasi
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = `Siz jami ${blocksCount} ta savoldan <strong>${score}</strong> tasiga to'g'ri javob berdingiz! (${Math.round((score/blocksCount)*100)}%)`;
        resultDiv.scrollIntoView({ behavior: 'smooth' });
        
        document.getElementById('btn-check').disabled = true;
    }

    function resetQuiz() {
        generateQuiz();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Birinchi marta yuklanganda ishga tushirish
    window.addEventListener('DOMContentLoaded', () => {
        generateQuiz();
    });
</script>

</body>
</html>
